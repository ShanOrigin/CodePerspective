name: Workflow for Merging Branches

on:
  push:
    branches:
      - '**'  # Trigger for all branches

jobs:
  merge-branches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Fetch all branches
        run: git fetch --all

      - name: Run the merge script
        run: |
          #!/bin/bash

          # Get the branch name that triggered the push
          TRIGGERED_BRANCH=${GITHUB_REF##*/}

          # Define the hierarchical branch groups for merging (child to parent)
          declare -a BRANCH_GROUPS=(
            "react_src_components_head react_src_components react_src react main"
            "react_src_components_Footer react_src_components react_src react main"
            "react_src_components_Main react_src_components react_src react main"
            "react_src_components react_src react main"
            "react_src_Hooks react_src react main"
            "react_src_Contexts react_src react main"
            "react_src_Animation react_src react main"
            "react_src react main"
            "react_public react main"
            "react main"
            "server main"
            "database_data database main"
            "database main"
          )

          # Loop through each branch group
          for GROUP in "${BRANCH_GROUPS[@]}"; do
            # Convert the group into an array of branches
            BRANCHES=($GROUP)

            # Check if the triggered branch is the first element of the current group
            if [[ "${BRANCHES[0]}" == "$TRIGGERED_BRANCH" ]]; then
              echo "TRIGGERED_BRANCH is = $TRIGGERED_BRANCH"
              echo "Processing branch group: $GROUP"

              # Loop through each branch in the group (from child to parent)
              for ((i = 0; i < ${#BRANCHES[@]} - 1; i++)); do
                CURRENT_BRANCH=${BRANCHES[i]}
                NEXT_BRANCH=${BRANCHES[i+1]}

                # Ensure the next branch exists
                echo "Checking if branch '$NEXT_BRANCH' exists..."

                # Fetch the latest changes for the next branch
                git fetch origin $NEXT_BRANCH

                # Verify that the next branch exists in the remote repository
                if git show-ref --verify --quiet refs/remotes/origin/$NEXT_BRANCH; then
                  echo "Branch '$NEXT_BRANCH' exists, proceeding with merge..."

                  # Checkout the next branch and ensure it is up-to-date
                  git checkout $NEXT_BRANCH
                  git pull origin $NEXT_BRANCH

                  echo "Merging $CURRENT_BRANCH into $NEXT_BRANCH"
                  git merge --no-ff $CURRENT_BRANCH -m "Automated merge of $CURRENT_BRANCH into $NEXT_BRANCH"

                  # Push changes to the remote repository
                  git push origin $NEXT_BRANCH

                  # Check for merge conflicts and stop if found
                  if [ $? -ne 0 ]; then
                    echo "Merge conflict detected during merging $CURRENT_BRANCH into $NEXT_BRANCH"
                    exit 1
                  fi
                else
                  echo "Branch '$NEXT_BRANCH' does not exist or was not found. Skipping merge for this group."
                  break
                fi
              done
              break  # Exit the loop after processing the matched group
            fi
          done

          echo "Merging process completed for $TRIGGERED_BRANCH"
