name: Merge Branches

on:
  push:
    branches:
      - '**' # Trigger on push to any branch

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch full history for all branches

      # Step 2: Set up Git configuration
      - name: Set up Git user
        run: |
          git config --global user.name "SOC2050"
          git config --global user.email "gv2422244242@gmail.com"

      # Step 3: Run the branch merging script
      - name: Run branch merging script
        run: |
          #!/bin/bash

          set -e # Exit on any error
          set -x # Enable debugging

          # Get the branch name that triggered the push
          TRIGGERED_BRANCH=${GITHUB_REF##*/}

          # Validate the triggered branch
          if [[ -z "$TRIGGERED_BRANCH" ]]; then
            echo "Error: TRIGGERED_BRANCH is empty."
            exit 1
          fi
          echo "Triggered branch: $TRIGGERED_BRANCH"

          # Define the hierarchical branch groups for merging (child to parent)
          declare -a BRANCH_GROUPS=(
            "react_src_components_head react_src_components react_src react main"
            "react_src_components_Footer react_src_components react_src react main"
            "react_src_components_Main react_src_components react_src react main"
            "react_src_components react_src react main"
            "react_src_Hooks react_src react main"
            "react_src_Contexts react_src react main"
            "react_src_Animation react_src react main"
            "react_src react main"
            "react_public react main"
            "react main"
            "server main"
            "database_data database main"
            "database main"
          )

          # Fetch all remote branches to ensure they are available locally
          git fetch --all --prune

          # Process each branch group
          for GROUP in "${BRANCH_GROUPS[@]}"; do
            # Split group into an array of branches
            BRANCHES=($GROUP)

            # Check if the triggered branch matches the first branch in the group
            if [[ "${BRANCHES[0]}" == "$TRIGGERED_BRANCH" ]]; then
              echo "Processing branch group: $GROUP"

              # Iterate through the branches in the group
              for ((i = 0; i < ${#BRANCHES[@]} - 1; i++)); do
                CURRENT_BRANCH=${BRANCHES[i]}
                NEXT_BRANCH=${BRANCHES[i+1]}

                # Ensure the next branch exists remotely
                if git ls-remote --exit-code origin $NEXT_BRANCH; then
                  echo "Branch '$NEXT_BRANCH' exists. Proceeding with merge..."

                  # Checkout the next branch or create it if missing locally
                  git checkout $NEXT_BRANCH || git checkout -b $NEXT_BRANCH --track origin/$NEXT_BRANCH

                  # Pull the latest changes
                  git pull origin $NEXT_BRANCH

                  # Merge the current branch into the next branch
                  echo "Merging $CURRENT_BRANCH into $NEXT_BRANCH"
                  git merge --no-ff --allow-unrelated-histories $CURRENT_BRANCH -m "Automated merge of $CURRENT_BRANCH into $NEXT_BRANCH"

                  # Push the changes back to the remote repository
                  git push origin $NEXT_BRANCH || {
                    echo "Error: Failed to push changes for $NEXT_BRANCH."
                    exit 1
                  }

                  # Check for merge conflicts
                  if [ $? -ne 0 ]; then
                    echo "Merge conflict detected during merging $CURRENT_BRANCH into $NEXT_BRANCH"
                    exit 1
                  fi
                else
                  echo "Branch '$NEXT_BRANCH' does not exist remotely. Skipping this group."
                  break
                fi
              done
              break # Exit the loop after processing the matched group
            fi
          done

          echo "Merging process completed for $TRIGGERED_BRANCH."

